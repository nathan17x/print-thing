# CUPS is internal to the container: only the web app talks to it.
LogLevel warn
MaxLogSize 1m
Listen localhost:631
Listen /run/cups/cups.sock
Browsing No
WebInterface No
DefaultAuthType None
# Keep finished jobs around briefly so the app can read their final state.
PreserveJobHistory 1d
PreserveJobFiles No
# Write job state to disk immediately so queued jobs survive restarts.
DirtyCleanInterval 0
MaxJobs 2000
# When the printer is unreachable, retry instead of stopping the whole queue.
JobRetryInterval 20
JobRetryLimit 15
ErrorPolicy retry-job

<Location />
  Order allow,deny
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
